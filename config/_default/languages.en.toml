disabled = false
locale = "en"
label = "English"
weight = 1

# Title and description below are Joon's own wording from the previous
# _config.yml, kept verbatim pending his instruction. Do not invent replacements.
title = "Joon's homepage"

[params]
  displayName = "EN"
  isoCode = "en"
  rtl = false
  dateFormat = "2 January 2006"
  description = "Bookmark this to keep an eye on my project updates!"
  # "{ year }" is substituted by the theme with the current year at build time.
  copyright = "© { year } Joon Hwa Jung"

  # Home page <h1>, rendered as HTML by layouts/partials/home/profile.html so
  # part of it can carry the brand colour. Kept separate from author.name,
  # which feeds <meta name="author"> and the JSON-LD author and should stay a
  # person's name.
  homeHeading = 'About <span class="heading-accent">AI Computations</span> by jjbits'

[params.author]
  name = "Joon Hwa Jung"
  links = [
    { github = "https://github.com/jjbits" },
  ]
